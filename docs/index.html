:root{--bg:#0a0b0b;--panel:#121414;--line:#262a2a;--ink:#e4e6e1;--dim:#868b86;--acc:#c6ff3d;--sig:#ff4f1f;
  --f-head:"Chakra Petch",system-ui,sans-serif;--f-body:"Schibsted Grotesk","Chakra Petch",system-ui,sans-serif;--f-mono:"Martian Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);overflow-x:hidden}
.gate{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:32px 16px;max-width:520px;margin:0 auto}
.gate h1{font:600 clamp(40px,11vw,72px)/.95 var(--f-head);letter-spacing:.02em;margin:0 0 40px}
.gate form{display:grid;grid-template-columns:1fr auto;gap:8px}
.gate label{grid-column:1/-1;font:500 12px/1 var(--f-head);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.gate input{min-width:0;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:0;padding:12px;font:16px var(--f-mono);outline:none}
.gate input:focus{border-color:var(--acc)}
.gate button{background:transparent;color:var(--acc);border:1px solid var(--acc);border-radius:0;padding:0 20px;font:500 13px var(--f-head);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.gate button:hover,.gate button:focus-visible{background:var(--acc);color:var(--bg);outline:none}
.gate button[disabled]{opacity:.5;cursor:wait}
.gate .err{grid-column:1/-1;margin:4px 0 0;color:var(--sig);font:500 12px var(--f-head);letter-spacing:.1em;text-transform:uppercase;min-height:1.2em}
.legal{color:var(--dim);font-size:12px;line-height:1.5;margin:48px 0 0}
.legal p{margin:0 0 6px}

<body>
<main class="gate" id="gate">
  <h1>POST<br>HUMAN</h1>
  <form id="gate-form" autocomplete="off">
    <label for="pw">Password</label>
    <input id="pw" name="pw" type="password" autocomplete="current-password" required autofocus>
    <button type="submit" id="go">Enter</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <div class="legal">
    <p>&copy; 2026 Marko Manriquez. All rights reserved.</p>
    <p>No reproduction, redistribution or use for AI or machine-learning training without written permission.</p>
  </div>
</main>
<script>
(function () {
  'use strict';
  var CFG = {"salt":"KdPUBUKEok611YrAbFyBmg==","iter":600000,"app":"232abd7e1b57"};
  var KEY_SLOT = 'ph.k';
  var waiting = {};
  window.PH = function (name, data) { if (waiting[name]) waiting[name](data); };

  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function unb64(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }

  // payloads are <script> files so this also works from file://
  var inflight = {};
  function fetchPayload(name) {
    if (inflight[name]) return inflight[name];
    return inflight[name] = new Promise(function (res, rej) {
      var s = document.createElement('script');
      waiting[name] = function (d) { delete waiting[name]; s.remove(); res(d); };
      s.onerror = function () { delete waiting[name]; delete inflight[name]; s.remove(); rej(new Error('payload ' + name)); };
      s.src = 'p/' + name + '.js';
      document.head.appendChild(s);
    });
  }

  var key = null;
  function decrypt(name) {
    return fetchPayload(name).then(function (d) {
      var u = b64(d);
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.subarray(0, 12) }, key, u.subarray(12));
    }).then(function (buf) { return new Uint8Array(buf); });
  }
  function decryptText(name) { return decrypt(name).then(function (u) { return new TextDecoder().decode(u); }); }

  function derive(pw) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(CFG.salt), iterations: CFG.iter, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }

  function boot() {
    return decryptText(CFG.app).then(function (txt) {
      var app = JSON.parse(txt);
      var st = document.createElement('style'); st.textContent = app.css; document.head.appendChild(st);
      document.getElementById('gate').remove();
      document.body.insertAdjacentHTML('afterbegin', app.html);
      var main = new Function(app.js + '\n;return main;')();
      main({ data: app, decrypt: decrypt, decryptText: decryptText });
    });
  }

  function remember() {
    return crypto.subtle.exportKey('raw', key).then(function (raw) {
      try { sessionStorage.setItem(KEY_SLOT, CFG.salt + ':' + unb64(new Uint8Array(raw))); } catch (e) {}
    });
  }

  var form = document.getElementById('gate-form'), pw = document.getElementById('pw'),
      go = document.getElementById('go'), err = document.getElementById('err');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    err.textContent = '';
    go.disabled = true;
    derive(pw.value).then(function (k) { key = k; return boot(); }).then(remember).catch(function (x) {
      key = null; go.disabled = false; pw.select();
      err.textContent = x && x.name === 'OperationError' ? 'Wrong password' : 'Could not load';
      if (!(x && x.name === 'OperationError')) console.error(x);
    });
  });

  var saved = null;
  try { saved = sessionStorage.getItem(KEY_SLOT); } catch (e) {}
  if (saved && saved.indexOf(CFG.salt + ':') === 0) {
    crypto.subtle.importKey('raw', b64(saved.slice(CFG.salt.length + 1)), { name: 'AES-GCM' }, true, ['decrypt'])
      .then(function (k) { key = k; return boot(); })
      .catch(function () { key = null; try { sessionStorage.removeItem(KEY_SLOT); } catch (e) {} });
  }
})();
</script>
</body>
